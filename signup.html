<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup form</title>
    <style>

        *{
            padding:0px;
            margin:0px;
            box-sizing: border-box;
            font-family: serif;
            color:white;
        }

        body{
            background: url(image.png);
            width: 100vw;
            height: 100vh;
            background-size: cover;
            display:flex;
            align-items: center;
            justify-content: center;
        }

        #container{
            background: rgba(53, 53, 72, 0.5);
            backdrop-filter: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            width: 400px;
            height: 500px;
            border:1px solid blue;
            border-radius: 10px;
        }

        .groupi{
            width: 325px;
            margin: 6px 0px;
            padding:10px 0px;
            
        }

        .groupi input{
            width: 100%;
            height: 30px;
            outline: none;
            color: white;
            font-size: 1.1em;
            background: transparent;
            padding: 0px 30px 0px 15px


        }

        .groupi input:focus{
            box-shadow: 0 0 5px 2px rgb(89, 89, 235);
        }

        .groupi1{
            text-align: center;
        }


        .groupi1 a{
            text-decoration: none;
            font-size: 1.4em;
            color: blue;
        }

        .groupi1 a:hover{
            border-bottom: 1px solid blue;
        }

        #btn{
            width: 100%;
            height: 40px;
            border-radius: 10px;
            border:none;
            transition: 0.4s;
            font-size: 1.2em;
            background: linear-gradient(to right , rgb(89, 89, 235),rgb(55, 55, 238));
        }

        #btn:hover{
            zoom:1.3;
        }




    </style>
</head>
<body>
    

    <div id="container">

        <h2>Create Account</h2>
        <p>Join us to start tracking attendance</p>
        


            <div class="groupi">
                <input type="text" placeholder="Full Name" required>
            </div>

            <div class="groupi">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="groupi">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="groupi">
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <div class="groupi">
                <input id="btn" type="button" value="Sign Up" onclick="alert('Form submited succsesfully')" window.location.href="index.html">
            </div>

            <div class="groupi1">
                <p> Already have an account? <a href="login or singe up.html" target="_main">Login</a></p>
            </div>





        

    </div>




</body>
</html>
